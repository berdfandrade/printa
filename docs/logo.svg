<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Printa</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B3CFF"/>
      <stop offset="0.55" stop-color="#C13BD8"/>
      <stop offset="1" stop-color="#FF5A7E"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3B1E7A"/>
      <stop offset="1" stop-color="#160A33"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <path d="M16 128 A112 112 0 0 1 128 16 H384 A112 112 0 0 1 496 128 V210 Q256 290 16 210 Z" fill="url(#shine)"/>

  <!-- crop / selection brackets -->
  <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M92 156 V92 H156"/>
    <path d="M356 92 H420 V156"/>
    <path d="M420 356 V420 H356"/>
    <path d="M156 420 H92 V356"/>
  </g>

  <!-- P: stem -->
  <rect x="152" y="142" width="58" height="236" rx="29" fill="#fff"/>
  <!-- P: bowl = camera lens -->
  <circle cx="270" cy="232" r="92" fill="#fff"/>
  <circle cx="270" cy="232" r="64" fill="url(#lens)"/>
  <g stroke="#8E6BFF" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="270.0" y1="210.0" x2="324.1" y2="217.5"/><line x1="289.1" y1="221.0" x2="309.6" y2="271.6"/><line x1="289.1" y1="243.0" x2="255.5" y2="286.1"/><line x1="270.0" y1="254.0" x2="215.9" y2="246.5"/><line x1="250.9" y1="243.0" x2="230.4" y2="192.4"/><line x1="250.9" y1="221.0" x2="284.5" y2="177.9"/>
  </g>
  <polygon points="270.0,210.0 289.1,221.0 289.1,243.0 270.0,254.0 250.9,243.0 250.9,221.0" fill="#0B0520" stroke="#8E6BFF" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="244" cy="204" r="11" fill="#fff" opacity="0.85"/>
  <circle cx="262" cy="192" r="4.5" fill="#fff" opacity="0.6"/>

  <!-- flash sparkle -->
  <path d="M392 196 Q396 222 420 226 Q396 230 392 256 Q388 230 364 226 Q388 222 392 196 Z" fill="#FFE066"/>
  <circle cx="356" cy="312" r="8" fill="#FFE066" opacity="0.9"/>
</svg>
